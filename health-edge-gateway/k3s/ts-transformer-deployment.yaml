apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-transformer-inference
  namespace: health-edge
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: ts-transformer
        image: health-edge-gateway:latest
        resources:
          limits:
            memory: "1Gi"
            cpu: "1.5"
