version: "3.8"

# Edge microservices. Watch packets stay on MQTT; clinical logic is
# split so ingest never scores and FL never sits on the alert path.

services:
  local-mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    command: sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"

  ingest:
    build: .
    command: python src/services/ingest_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - local-mqtt

  fall:
    build: .
    command: python src/services/fall_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - ingest

  vitals:
    build: .
    command: python src/services/vitals_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - ingest

  fusion:
    build: .
    command: python src/services/fusion_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
      FUSION_SPLIT: "0"
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - ingest

  fl-client:
    build: .
    command: python src/federated_learning/fl_client.py
    environment:
      PYTHONPATH: /app/src
      FL_ONCE: "1"
    volumes:
      - ./.env:/app/.env:ro
    profiles:
      - cold

volumes:
  gateway-data:
