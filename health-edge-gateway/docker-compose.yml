version: "3.8"

# Hot-path microservices matching DACN_HuongTrienKhai.pdf Table 10.
# allow_anonymous is lab-only.

services:
  local-mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    command: sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"

  ingest:
    build: .
    command: python src/services/ingest_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - local-mqtt

  signal-proc:
    build: .
    command: python src/services/signal_proc_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - local-mqtt

  news2:
    build: .
    command: python src/services/news2_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - local-mqtt

  fall:
    build: .
    command: python src/services/fall_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - local-mqtt

  trend:
    build: .
    command: python src/services/trend_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - local-mqtt

  fusion:
    build: .
    command: python src/services/fusion_service.py
    environment:
      PYTHONPATH: /app/src
      MQTT_BROKER: local-mqtt
      SQLITE_PATH: /app/data/local_buffer.db
    volumes:
      - gateway-data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - local-mqtt

  fl-client:
    build: .
    command: python src/federated_learning/fl_client.py
    environment:
      PYTHONPATH: /app/src
      FL_ONCE: "1"
    volumes:
      - ./.env:/app/.env:ro
    profiles:
      - cold

volumes:
  gateway-data:
