apiVersion: batch/v1
kind: CronJob
metadata:
  name: fl-client
  namespace: health-edge
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: fl-client
              image: health-edge-gateway:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "learning.fl_client"]
              env:
                - name: FL_ONCE
                  value: "1"
              envFrom:
                - configMapRef:
                    name: edge-config
              volumeMounts:
                - name: gateway-data
                  mountPath: /app/data
          volumes:
            - name: gateway-data
              persistentVolumeClaim:
                claimName: gateway-data
